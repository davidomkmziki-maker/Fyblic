<script id="happyad-no-demo-posts-cleaner-v63">
(function(){
  var POST_KEY='HAPPYAD_PUBLISH_POSTS_V2';
  var ACTION_KEY='HAPPYAD_VIDEO_ACTIONS_V1';
  function lower(v){return String(v==null?'':v).toLowerCase();}
  function isDemoPost(p){
    if(!p || typeof p!=='object') return true;
    var title=lower(p.title||p.name||p.caption);
    var creator=lower(p.creatorName||p.userName||p.author);
    var id=lower(p.id);
    var cid=lower(p.creatorId);
    var handle=lower(p.handle||p.username);
    return id.indexOf('demo')>=0 || cid==='u_demo' || title.indexOf('renos pro')>=0 || title==='broks' || creator.indexOf('renos')>=0 || creator.indexOf('broks')>=0 || handle.indexOf('broks')>=0 || handle.indexOf('renos')>=0;
  }
  try{
    var arr=JSON.parse(localStorage.getItem(POST_KEY)||'[]');
    if(Array.isArray(arr)){
      var before=arr.length;
      var clean=arr.filter(function(p){return !isDemoPost(p)});
      if(clean.length!==before){
        try{localStorage.removeItem(POST_KEY);localStorage.removeItem('HAPPYAD_GLOBAL_POSTS_CACHE_V1');localStorage.removeItem('HAPPYAD_PROFILE_POSTS_CACHE_V1');}catch(_e){}
        try{
          var actions=JSON.parse(localStorage.getItem(ACTION_KEY)||'{}');
          Object.keys(actions||{}).forEach(function(k){
            var found=clean.some(function(p){return String(p.id)===String(k)});
            if(!found) delete actions[k];
          });
          localStorage.setItem(ACTION_KEY,JSON.stringify(actions));
        }catch(e){}
      }
    }
  }catch(e){try{localStorage.removeItem(POST_KEY);}catch(_e){}}
  try{
    var ap=JSON.parse(localStorage.getItem('HAPPYAD_ACTIVE_PROFILE')||'null');
    var n=lower(ap&&ap.name), h=lower(ap&&ap.handle);
    if(n.indexOf('broks')>=0||n.indexOf('renos')>=0||h.indexOf('broks')>=0||h.indexOf('renos')>=0){
      localStorage.removeItem('HAPPYAD_ACTIVE_PROFILE');
    }
  }catch(e){}
})();
</script>

  function simpleProgressMessage(text,value){var raw=String(text||'');if(/échec|echec|failed|erreur/i.test(raw))return 'Échec';if(/termin|publiée|publiee|published/i.test(raw))return 'Publication terminée';if(Number(value||0)<=45||/envoi|upload/i.test(raw))return 'Envoi du média';return 'Publication en cours';}

  function openDB(){
    return new Promise((resolve,reject)=>{
      const req=indexedDB.open("HAPPYAD_MEDIA_DB",1);
      req.onupgradeneeded=()=>{req.result.createObjectStore("media",{keyPath:"id"});};
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
    });
  }

  async function saveMedia(record){
    const db=await openDB();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction("media","readwrite");
      tx.objectStore("media").put(record);
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error||new Error("IndexedDB media erreur"));
      tx.onabort=()=>reject(tx.error||new Error("IndexedDB media annulé"));
    });
  }

  // V210 : IndexedDB est un cache local seulement.
  // Sur mobile, écrire un gros File/Blob dans IndexedDB peut rester pendu sans erreur
  // et bloquer l'interface à 90%. Donc on ne bloque jamais la publication sur ce cache.
  async function saveMediaBestEffort(record){
    try{
      await withTimeout(saveMedia(record),3500,'Cache média local');
      return true;
    }catch(e){
      console.warn('Cache média local ignoré pour ne pas bloquer la publication',e);

  function escapeHtml(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  function normalizeCropV613D(crop){
    crop=crop||{v:2,scale:1,x:50,y:50};
    var scale=Math.max(1,Math.min(4,Number(crop.scale||1)));
    var x,y;
    if(Number(crop.v||0)>=2){x=Number(crop.x);y=Number(crop.y);}
    else{x=50-Number(crop.x||0);y=50-Number(crop.y||0);}
    if(!Number.isFinite(x))x=50;if(!Number.isFinite(y))y=50;
    return {v:2,scale:scale,x:Math.max(0,Math.min(100,x)),y:Math.max(0,Math.min(100,y))};
  }

        if(Number.isFinite(target) && Math.abs((v.currentTime||0)-target)>.04)v.currentTime=target;

  /* V903 : la barre Miniature doit piloter uniquement la frame de la vidéo Détails,
     sans être capturée par le moteur de cadrage tactile du conteneur. */
  var miniatureSeekRafV903=0;
  function seekMiniaturePreviewV903(rawValue){
    if(state.kind!=='video'||state.mode==='story')return;
    var value=Number(rawValue);
    if(!Number.isFinite(value))value=0;
    var max=Math.max(.1,Number(state.videoDuration)||.1);
    value=Math.max(0,Math.min(value,max));
    state.videoFrame=value;
    syncAdjustValues();
    if(miniatureSeekRafV903)cancelAnimationFrame(miniatureSeekRafV903);
    miniatureSeekRafV903=requestAnimationFrame(function(){
      miniatureSeekRafV903=0;
      var box=$('detailPreview');
      var video=box&&box.querySelector('video.videoFramePreview');
      if(!video)return;
      function applySeek(){
        try{
          var duration=Number(video.duration||state.videoDuration||0);
          if(Number.isFinite(duration)&&duration>0)state.videoDuration=duration;
          var target=Number(state.videoFrame)||0;
          if(duration>0)target=Math.min(target,Math.max(0,duration-.05));
          try{video.removeAttribute('poster');}catch(_e){}
          video.style.display='block';video.style.visibility='visible';video.style.opacity='1';
          try{video.pause();}catch(_e){}
          if(Number.isFinite(target)){
            if(typeof video.fastSeek==='function'){
              try{video.fastSeek(target);}catch(_e){video.currentTime=target;}
            }else video.currentTime=target;
          }
        }catch(_e){}
      }
      if(video.readyState>=1)applySeek();
      else video.addEventListener('loadedmetadata',applySeek,{once:true});
    });
  }

  function mediaListPreflightV1117R2(files){

    for(var i=0;i<files.length;i++){
      var file=files[i];
      if(!(file.type&&(/^(image|video)\//).test(file.type)))return {ok:false,error:'Cette publication accepte une photo ou une vidéo',durations:[]};
      if(!Number.isSafeInteger(Number(file.size))||Number(file.size)<=0)return {ok:false,error:'Média invalide',durations:[]};
      if(Number(file.size)>FYBLIC_MAX_MEDIA_BYTES_V1112)return {ok:false,error:'Média trop lourd : maximum 4 Go',durations:[]};
    }

      video.removeEventListener('loadeddata',check);
      video.removeEventListener('canplay',check);

      if(!Number.isFinite(duration)||duration<=0)return;
      done=true;cleanup();

      if(Array.isArray(state.mediaDurations))state.mediaDurations[0]=duration;
      state.mediaLimitsChecked=true;state.mediaValidationError='';

  function happyadVideoThumbFromFile(file,frameTime,crop){
    return new Promise(function(resolve){
      try{
        if(!file || !String(file.type||'').toLowerCase().includes('video'))return resolve(null);
        const video=document.createElement('video');
        const url=URL.createObjectURL(file);
        let done=false;
        function finish(blob){if(done)return;done=true;try{URL.revokeObjectURL(url)}catch(e){}resolve(blob||null)}
        video.muted=true; video.playsInline=true; video.preload='metadata'; video.src=url;
        video.addEventListener('loadedmetadata',function(){try{
          var duration=Number(video.duration||1);
          var selected=(frameTime==null)?Math.min(1,Math.max(.15,duration*.08)):Number(frameTime);
          video.currentTime=Math.min(Math.max(0,selected),Math.max(0,duration-.05));
        }catch(e){finish(null)}},{once:true});
        video.addEventListener('seeked',function(){try{
          const c=document.createElement('canvas');
          const vw=video.videoWidth||640, vh=video.videoHeight||360;
          const size=720;c.width=size;c.height=size;
          const ctx=c.getContext('2d');if(!ctx)return finish(null);
          crop=crop||{v:2,scale:1,x:50,y:50};
          const scale=Math.max(1,Math.min(4,Number(crop.scale||1)));
          const fx=Number(crop.v||0)>=2?Math.max(0,Math.min(100,Number(crop.x==null?50:crop.x))):Math.max(0,Math.min(100,50-Number(crop.x||0)));
          const fy=Number(crop.v||0)>=2?Math.max(0,Math.min(100,Number(crop.y==null?50:crop.y))):Math.max(0,Math.min(100,50-Number(crop.y||0)));
          const base=Math.min(vw,vh), side=base/scale;
          const sx=Math.max(0,Math.min(vw-side,(vw-side)*(fx/100)));
          const sy=Math.max(0,Math.min(vh-side,(vh-side)*(fy/100)));
          ctx.drawImage(video,sx,sy,side,side,0,0,size,size);
          c.toBlob(function(blob){finish(blob)},'image/jpeg',0.84);
        }catch(e){finish(null)}},{once:true});
        video.addEventListener('error',function(){finish(null)},{once:true});
        setTimeout(function(){finish(null)},6500);
      }catch(e){resolve(null)}
    });
  }
