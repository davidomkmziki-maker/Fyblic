<!doctype html>
<html lang="fr" data-happyad-page="publish">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#080b10">
  <title>Fyblic — Publier</title>
  <script src="../core/supabase-config-master-v973.js?v=1070"></script><script src="../core/supabase-client-master-v972.js?v=1070"></script>
  <script>window.FYBLIC_MEDIA_COMPRESSOR_URL=window.FYBLIC_MEDIA_COMPRESSOR_URL||'https://fyblic-media-worker-production.up.railway.app';</script>
  <script src="../core/media-compression-client-v1.js?v=1070"></script><script src="../core/publication-engine-v1070.js?v=1070"></script>
  <style>
    :root{color-scheme:dark;--bg:#05070a;--line:rgba(255,255,255,.13);--text:#fff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{max-width:540px;margin:auto}.app{height:100dvh;display:flex;flex-direction:column}.top{height:66px;flex:0 0 66px;display:grid;grid-template-columns:48px 1fr auto;align-items:center;padding:0 13px;border-bottom:1px solid rgba(255,255,255,.06)}button,input,textarea,select{font:inherit}.close{border:0;background:transparent;color:#fff;font-size:34px;padding:0}.title{font-size:19px;font-weight:950}.mode{min-width:98px;height:40px;padding:0 13px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:#10151d;color:#fff;font-weight:900}.scroll{flex:1;min-height:0;overflow:auto;padding:12px 14px calc(18px + env(safe-area-inset-bottom));display:grid;align-content:start;gap:12px}.preview{position:relative;width:100%;aspect-ratio:1/1;border:1px solid var(--line);border-radius:24px;background:#090c11;overflow:hidden;display:grid;place-items:center}.preview img,.preview video{width:100%;height:100%;object-fit:contain;background:#000}.preview.empty button{border:1px solid var(--line);border-radius:18px;background:#141a23;color:#fff;padding:16px 21px;font-weight:900}.change{position:absolute;top:10px;right:10px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(0,0,0,.66);color:#fff;padding:9px 13px;font-size:12px;font-weight:900}.count{position:absolute;left:11px;bottom:11px;border-radius:999px;background:rgba(0,0,0,.68);padding:7px 10px;font-size:12px;font-weight:900}.pick{height:50px;border:1px solid var(--line);border-radius:17px;background:#10151d;color:#fff;font-weight:900}.field{width:100%;min-height:50px;border:1px solid var(--line);border-radius:16px;background:#0b0f15;color:#fff;padding:13px 14px;outline:0}textarea.field{min-height:104px;resize:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.shop{display:grid;gap:9px}.shop[hidden],#liveTitle[hidden]{display:none}.publish{height:54px;border:0;border-radius:18px;background:#fff;color:#080a0d;font-weight:1000;font-size:17px}.publish:disabled{opacity:.42}.message{min-height:19px;color:#aeb6c3;text-align:center;font-size:12px;font-weight:800}.message.error{color:#ff6574}input[type=file]{display:none}@media(max-height:730px){.preview{aspect-ratio:1.2/1}}
  </style>
</head>
<body><main class="app"><header class="top"><button id="closeButton" class="close" type="button" aria-label="Fermer">×</button><div class="title">Créer</div><button id="modeButton" class="mode" type="button">Normal ›</button></header><section class="scroll">
    <div id="preview" class="preview empty"></div><button id="pickButton" class="pick" type="button">Choisir dans la galerie</button><input id="fileInput" type="file" accept="image/*,video/*">
    <input id="liveTitle" class="field" placeholder="Titre du Live" hidden><textarea id="description" class="field" maxlength="6000" placeholder="Ajouter une description…"></textarea><input id="location" class="field" maxlength="120" placeholder="Lieu (facultatif)">
    <div id="boutiqueFields" class="shop" hidden><input id="title" class="field" maxlength="140" placeholder="Titre de l’article"><div class="grid"><input id="price" class="field" inputmode="decimal" placeholder="Prix"><select id="currency" class="field"><option>USD</option><option>CDF</option><option>UGX</option><option>EUR</option></select></div><div class="grid"><select id="category" class="field"><option>Produit</option><option>Électronique</option></select><select id="condition" class="field"><option>Neuf</option><option>Comme neuf</option><option>Occasion</option><option>Reconditionné</option></select></div><div class="grid"><input id="quantity" class="field" inputmode="numeric" value="1" placeholder="Quantité"><input id="brand" class="field" placeholder="Marque"></div><input id="model" class="field" placeholder="Modèle"><div class="grid"><input id="city" class="field" placeholder="Ville"><input id="country" class="field" placeholder="Pays"></div></div>
    <div id="composerMessage" class="message" aria-live="polite"></div><button id="publishButton" class="publish" type="button" disabled>Publier</button>
  </section></main><script src="../core/publication-composer-v1070.js?v=1070"></script></body>
</html>
