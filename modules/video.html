  }
  function deleteMediaIds(ids){
    if(!ids || !ids.length || !window.indexedDB) return;
    try{
      var req=indexedDB.open('HAPPYAD_MEDIA_DB',1);
      req.onsuccess=function(){
        try{
          var db=req.result;
          if(!db.objectStoreNames.contains('media')) return;
          var tx=db.transaction('media','readwrite');
          var store=tx.objectStore('media');
          ids.forEach(function(id){ try{ store.delete(id); }catch(e){} });
        }catch(e){}
      };
    }catch(e){}
  }
  try{
    var arr=JSON.parse(localStorage.getItem(POST_KEY)||'[]');
    if(Array.isArray(arr)){
      var removed=[];
      var clean=arr.filter(function(p){ var d=isDemoPost(p); if(d && p && p.id!=null) removed.push(p.id); return !d; });
      if(clean.length!==arr.length){
        localStorage.setItem(POST_KEY,JSON.stringify(clean));
        deleteMediaIds(removed);
        try{
          var actions=JSON.parse(localStorage.getItem(ACTION_KEY)||'{}');
          removed.forEach(function(id){ delete actions[id]; delete actions[String(id)]; });
          localStorage.setItem(ACTION_KEY,JSON.stringify(actions));
        }catch(e){}
      }
    }
  }catch(e){ localStorage.setItem(POST_KEY,'[]'); }
  try{
    var u=JSON.parse(localStorage.getItem(USER_KEY)||'null');

  }catch(e){ localStorage.removeItem(USER_KEY); }

})();
