body {
  width: 100%;
  min-width: 0;
  min-height: 100vh;
  min-height: 100dvh;
  overscroll-behavior-y: contain;
}

.notification-shell {
  width: 100%;
  max-width: 760px;
  min-width: 0;
  min-height: 100vh;
  min-height: 100dvh;
}

.notification-header {
  min-width: 0;
  height: calc(var(--header-height) + var(--safe-top));
  padding: var(--safe-top) var(--page-pad) 0;
  grid-template-columns: clamp(40px, 12vw, 48px) minmax(0, 1fr) clamp(40px, 12vw, 48px);
}

.notification-header h1 {
  min-width: 0;
  font-size: clamp(1.18rem, 6vw, 1.7rem);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.icon-button {
  width: clamp(38px, 11vw, 44px);
  height: clamp(38px, 11vw, 44px);
}

.filter-button {
  width: clamp(38px, 11vw, 42px);
  height: clamp(38px, 11vw, 42px);
}

.filter-strip {
  top: calc(var(--header-height) + var(--safe-top));
  gap: clamp(7px, 2.2vw, 10px);
  padding: clamp(9px, 2.8vw, 14px) var(--page-pad) clamp(10px, 3vw, 16px);
  scroll-padding-inline: var(--page-pad);
}

.filter-chip {
  min-height: clamp(36px, 10vw, 42px);
  padding-inline: clamp(14px, 4.8vw, 19px);
  font-size: clamp(.84rem, 3.8vw, .96rem);
}

.notification-content {
  width: 100%;
  min-width: 0;
  padding: 0 var(--page-pad) calc(22px + var(--safe-bottom));
}

.notification-list,
.feed-section,
.suggestions-section,
.suggestion-list {
  min-width: 0;
}

.notification-item {
  width: 100%;
  min-width: 0;
  min-height: clamp(94px, 27vw, 128px);
  grid-template-columns: var(--lead-size) minmax(0, 1fr) auto;
  gap: clamp(9px, 3vw, 18px);
  padding: clamp(12px, 4vw, 18px) 0;
}

.notification-leading {
  appearance: none;
  width: var(--lead-size);
  height: var(--lead-size);
  min-width: 0;
  padding: 0;
  border: 0;
  background: transparent;
  color: inherit;
}

button.notification-leading {
  cursor: pointer;
}

.profile-trigger,
.publication-trigger,
.suggestion-profile-trigger,
.suggestion-name-trigger,
.details-trigger {
  -webkit-tap-highlight-color: transparent;
}

.profile-trigger:focus-visible,
.publication-trigger:focus-visible,
.suggestion-profile-trigger:focus-visible,
.suggestion-name-trigger:focus-visible,
.details-trigger:focus-visible {
  outline: 2px solid var(--blue-2);
  outline-offset: 3px;
}

.avatar,
.activity-icon {
  width: calc(var(--lead-size) - 4px);
  height: calc(var(--lead-size) - 4px);
}

.avatar-badge {
  width: clamp(24px, 8vw, 30px);
  height: clamp(24px, 8vw, 30px);
  border-width: clamp(2px, .8vw, 3px);
}

.notification-copy {
  min-width: 0;
  overflow-wrap: anywhere;
}

.notification-copy p {
  max-width: 100%;
  font-size: clamp(.91rem, 4.2vw, 1.13rem);
  line-height: 1.32;
}

.notification-copy time {
  margin-top: clamp(4px, 1.5vw, 6px);
  font-size: clamp(.78rem, 3.5vw, .92rem);
}

.notification-tail {
  min-width: 0;
  max-width: min(40vw, 230px);
  margin-right: clamp(5px, 2vw, 11px);
}

.publication-trigger,
.details-trigger {
  appearance: none;
  display: grid;
  place-items: center;
  min-width: 0;
  padding: 0;
  border: 0;
  border-radius: clamp(11px, 3.5vw, 15px);
  background: transparent;
  color: inherit;
  cursor: pointer;
}

.notification-thumb {
  width: var(--thumb-size);
  height: var(--thumb-size);
  border-radius: clamp(11px, 3.5vw, 15px);
}

.follow-back {
  min-height: clamp(40px, 11vw, 48px);
  max-width: min(40vw, 220px);
  padding-inline: clamp(12px, 4vw, 22px);
  border-radius: clamp(11px, 3.5vw, 14px);
  font-size: clamp(.78rem, 3.7vw, 1rem);
  line-height: 1.12;
  white-space: normal;
}

.suggestion-item {
  width: 100%;
  min-width: 0;
  min-height: clamp(72px, 22vw, 84px);
  grid-template-columns: clamp(44px, 14vw, 58px) minmax(0, 1fr) auto clamp(26px, 8vw, 32px);
  gap: clamp(7px, 2.5vw, 14px);
}

.suggestion-profile-trigger,
.suggestion-name-trigger {
  appearance: none;
  min-width: 0;
  padding: 0;
  border: 0;
  background: transparent;
  color: inherit;
  text-align: left;
  cursor: pointer;
}

.suggestion-avatar {
  width: clamp(42px, 13vw, 52px);
  height: clamp(42px, 13vw, 52px);
}

.suggestion-copy,
.suggestion-copy strong,
.suggestion-copy span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.suggestion-follow {
  min-width: clamp(78px, 27vw, 132px);
  min-height: clamp(38px, 10vw, 42px);
  padding-inline: clamp(10px, 3.5vw, 18px);
  font-size: clamp(.82rem, 3.8vw, 1rem);
}

.filter-sheet {
  width: min(100%, 760px);
  max-height: min(84dvh, 700px);
  overflow-y: auto;
  padding-inline: var(--page-pad);
}

@media (max-width: 380px) {
  :root {
    --page-pad: 10px;
    --lead-size: 52px;
    --thumb-size: 56px;
  }

  .notification-item {
    gap: 9px;
  }

  .notification-item.has-follow-action {
    grid-template-columns: var(--lead-size) minmax(0, 1fr);
    grid-template-areas:
      "lead copy"
      "lead tail";
    align-items: start;
  }

  .notification-item.has-follow-action .notification-leading { grid-area: lead; }
  .notification-item.has-follow-action .notification-copy { grid-area: copy; }
  .notification-item.has-follow-action .notification-tail {
    grid-area: tail;
    justify-content: flex-start;
    max-width: 100%;
    margin: 7px 0 0;
  }

  .notification-item.has-follow-action .follow-back {
    width: auto;
    max-width: 100%;
    min-height: 38px;
    padding-inline: 12px;
  }

  .suggestion-item {
    grid-template-columns: 44px minmax(0, 1fr) auto 26px;
  }

  .suggestion-follow {
    min-width: 74px;
    padding-inline: 9px;
  }
}

@media (max-width: 340px) {
  .notification-item.is-unread::after { right: 1px; }
}

@media (max-width: 330px) {
  :root {
    --page-pad: 8px;
    --lead-size: 48px;
    --thumb-size: 50px;
  }

  .notification-header {
    grid-template-columns: 38px minmax(0, 1fr) 38px;
  }

  .notification-header h1 {
    font-size: 1.12rem;
  }

  .notification-copy p {
    font-size: .88rem;
  }

  .notification-tail {
    margin-right: 2px;
  }

  .suggestion-item {
    grid-template-columns: 40px minmax(0, 1fr) auto 24px;
    gap: 6px;
  }

  .suggestion-avatar {
    width: 38px;
    height: 38px;
  }

  .suggestion-follow {
    min-width: 66px;
    min-height: 36px;
    padding-inline: 7px;
    font-size: .76rem;
  }
}

@media (orientation: landscape) and (max-height: 520px) {
  :root {
    --safe-top: max(6px, env(safe-area-inset-top));
    --header-height: 52px;
    --lead-size: 48px;
    --thumb-size: 52px;
  }

  .filter-strip {
    padding-block: 7px 9px;
  }

  .notification-item {
    min-height: 78px;
    padding-block: 9px;
  }
}
/* ===== END Fyblic RESPONSIVE + INTEGRATION V2 ===== */


/* ===== Fyblic PROFILE + PUBLICATION FIX V3 ===== */
:root {
  /* Colonne de profil suffisamment large pour garder le badge hors de la photo. */
  --lead-size: clamp(68px, 19vw, 84px);
  --profile-circle-size: clamp(50px, 14.5vw, 58px);
  --profile-badge-size: clamp(20px, 6.5vw, 26px);
  --publication-square-size: clamp(52px, 17vw, 78px);
}

.notification-leading {
  overflow: visible;
}

.profile-avatar-shell {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  overflow: visible;
}

.avatar-frame {
  position: relative;
  flex: 0 0 auto;
  width: var(--profile-circle-size);
  height: var(--profile-circle-size);
  border-radius: 50%;
  overflow: hidden;
  background: linear-gradient(145deg, #111c2d, #060b13);
  border: 1px solid rgba(133, 169, 218, .42);
  box-shadow: 0 8px 22px rgba(0, 0, 0, .32);
  transform: translateZ(0);
}

.avatar-frame .avatar {
  width: 100%;
  height: 100%;
  min-width: 100%;
  min-height: 100%;
  display: block;
  border: 0;
  border-radius: 50%;
  object-fit: cover;
  object-position: center center;
  box-shadow: none;
  background: #0a1320;
}

.profile-avatar-shell .avatar-badge {
  position: absolute;
  right: 0;
  bottom: clamp(3px, 1.3vw, 7px);
  width: var(--profile-badge-size);
  height: var(--profile-badge-size);
  border: 0;
  outline: clamp(2px, .8vw, 3px) solid var(--bg);
  box-shadow: 0 5px 13px rgba(0, 0, 0, .42);
  z-index: 3;
}

.profile-avatar-shell .avatar-badge svg {
  width: 56%;
  height: 56%;
}

/* Cadre carré unique pour toute action liée à une publication. */
.publication-square {
  appearance: none;
  position: relative;
  flex: 0 0 auto;
  width: var(--publication-square-size);
  height: var(--publication-square-size);
  aspect-ratio: 1 / 1;
  padding: 0;
  overflow: hidden;
  display: grid;
  place-items: center;
  border-radius: clamp(10px, 3.4vw, 15px);
  border: 1px solid rgba(133, 158, 190, .28);
  background:
    radial-gradient(circle at 72% 18%, rgba(61, 123, 255, .18), transparent 42%),
    linear-gradient(145deg, #0d1a2b, #060c14);
  color: #7da2ff;
  box-shadow: 0 8px 23px rgba(0, 0, 0, .32);
  cursor: pointer;
  isolation: isolate;
}

.publication-square::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: inherit;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .025);
}

.publication-square .notification-thumb {
  width: 100%;
  height: 100%;
  min-width: 100%;
  min-height: 100%;
  display: block;
  object-fit: cover;
  object-position: center center;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  background: #09121f;
}

.publication-placeholder {
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
}

.publication-placeholder svg {
  width: 40%;
  height: 40%;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: drop-shadow(0 0 8px currentColor);
}

.publication-like { color: #ff6aa4; border-color: rgba(255, 79, 147, .38); }
.publication-comment { color: #6d8cff; border-color: rgba(83, 101, 255, .42); }
.publication-favorite { color: #ff9b45; border-color: rgba(255, 138, 53, .42); }
.publication-activity { color: #7f9dff; border-color: rgba(78, 112, 255, .40); }

.notification-tail {
  flex: 0 0 auto;
}

.suggestion-avatar-frame {
  width: clamp(42px, 13vw, 52px);
  height: clamp(42px, 13vw, 52px);
  border-radius: 50%;
  overflow: hidden;
  border: 1px solid rgba(133, 158, 190, .30);
  background: #0a1320;
  box-shadow: 0 5px 15px rgba(0, 0, 0, .24);
}

.suggestion-avatar-frame .suggestion-avatar {
  width: 100%;
  height: 100%;
  min-width: 100%;
  min-height: 100%;
  display: block;
  border: 0;
  border-radius: 50%;
  object-fit: cover;
  object-position: center center;
}

@media (max-width: 380px) {
  :root {
    --lead-size: 66px;
    --profile-circle-size: 48px;
    --profile-badge-size: 20px;
    --publication-square-size: 54px;
  }

  .notification-item:not(.has-follow-action) {
    grid-template-columns: var(--lead-size) minmax(0, 1fr) var(--publication-square-size);
  }
}

@media (max-width: 330px) {
  :root {
    --lead-size: 60px;
    --profile-circle-size: 44px;
    --profile-badge-size: 18px;
    --publication-square-size: 48px;
  }

  .profile-avatar-shell .avatar-badge {
    bottom: 5px;
  }
}
/* ===== END Fyblic PROFILE + PUBLICATION FIX V3 ===== */


/* ===== Fyblic BADGES + MEDIA FIT V4 ===== */
:root {
  --name-badge-size: clamp(15px, 4.7vw, 19px);
}

/* La colonne de gauche réserve le cercle et une poche distincte pour le badge d'action. */
.profile-avatar-shell {
  isolation: isolate;
}

.profile-avatar-shell::after {
  content: "";
  position: absolute;
  right: -1px;
  bottom: clamp(2px, 1vw, 6px);
  width: calc(var(--profile-badge-size) + 4px);
  height: calc(var(--profile-badge-size) + 4px);
  border-radius: 50%;
  background: var(--bg);
  z-index: 1;
}

/* La photo occupe réellement tout le cercle, sans marge interne. */
.avatar-frame,
.suggestion-avatar-frame {
  position: relative;
  isolation: isolate;
}

.avatar-frame .avatar,
.suggestion-avatar-frame .suggestion-avatar {
  position: absolute;
  inset: -1px;
  width: calc(100% + 2px) !important;
  height: calc(100% + 2px) !important;
  min-width: calc(100% + 2px) !important;
  min-height: calc(100% + 2px) !important;
  max-width: none;
  display: block;
  object-fit: cover !important;
  object-position: center center;
  padding: 0;
  margin: 0;
  transform: scale(1.025);
  transform-origin: center;
  background: #09111c;
  z-index: 2;
}

.avatar-fallback {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  border-radius: inherit;
  background:
    radial-gradient(circle at 30% 20%, rgba(79, 97, 255, .34), transparent 45%),
    linear-gradient(145deg, #142238, #08101b);
  color: #eef4ff;
  font-size: clamp(.78rem, 3.8vw, 1rem);
  font-weight: 850;
  letter-spacing: .02em;
  z-index: 1;
}

.avatar-frame.is-loaded .avatar-fallback,
.suggestion-avatar-frame.is-loaded .avatar-fallback {
  opacity: 0;
}

.avatar-frame.is-error .avatar,
.suggestion-avatar-frame.is-error .suggestion-avatar {
  display: none;
}

.profile-avatar-shell .avatar-badge {
  right: 0;
  bottom: clamp(3px, 1.3vw, 7px);
  z-index: 4;
}

/* Badge de compte Fyblic affiché près du nom, indépendant du badge d'action. */
.profile-name-badge {
  position: relative;
  width: var(--name-badge-size);
  height: var(--name-badge-size);
  margin-left: .28em;
  display: inline-block;
  vertical-align: -.18em;
  color: #fff;
  background: transparent;
  box-shadow: none;
  overflow: visible;
  flex: 0 0 auto;
  font-size: 0;
  line-height: 1;
  clip-path: polygon(50% 0%,58% 12%,71% 6%,76% 20%,91% 22%,88% 38%,100% 50%,88% 62%,91% 78%,76% 80%,71% 94%,58% 88%,50% 100%,42% 88%,29% 94%,24% 80%,9% 78%,12% 62%,0% 50%,12% 38%,9% 22%,24% 20%,29% 6%,42% 12%);
}

.profile-name-badge::before {
  content: '';
  position: absolute;
  inset: 0;
  clip-path: inherit;
  z-index: 0;
}

.profile-name-badge::after {
  content: '✓';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -53%);
  color: #fff;
  font-size: calc(var(--name-badge-size) * .58);
  font-weight: 1000;
  line-height: 1;
  text-shadow: 0 0 3px rgba(255,255,255,.78);
  z-index: 1;
}

.profile-name-badge.blue::before,
.profile-name-badge.bleu::before {
  background: linear-gradient(135deg,#6fd4ff,#38b6ff,#0090ff);
  box-shadow: 0 0 3px rgba(79,195,255,.48),0 0 8px rgba(0,120,255,.30);
}

.profile-name-badge.violet::before,
.profile-name-badge.purple::before {
  background: linear-gradient(135deg,#e9d5ff,#c084fc,#9333ea);
  box-shadow: 0 0 3px rgba(147,51,234,.48),0 0 8px rgba(109,40,217,.30);
}

.profile-name-badge.yellow::before,
.profile-name-badge.jaune::before {
  background: linear-gradient(135deg,#ffe27a,#ffb020,#ff7a00);
  box-shadow: 0 0 3px rgba(255,176,32,.48),0 0 8px rgba(255,122,0,.30);
}

.profile-name-badge.is-image {
  display: inline-grid;
  place-items: center;
  clip-path: none;
  border-radius: 50%;
  overflow: hidden;
}

.profile-name-badge.is-image::before,
.profile-name-badge.is-image::after {
  display: none;
}

.profile-name-badge img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  border-radius: inherit;
}

.suggestion-name-row {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 1px;
}

.suggestion-name-row strong {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Le carré publication reste strictement carré et l'image le remplit complètement. */
.publication-square {
  position: relative;
  overflow: hidden;
  aspect-ratio: 1 / 1;
  contain: paint;
}

.publication-square .publication-placeholder {
  position: absolute;
  inset: 0;
  z-index: 1;
  opacity: 1;
  transition: opacity .15s ease;
}

.publication-square .notification-thumb,
.publication-square .publication-media {
  position: absolute;
  inset: -1px;
  width: calc(100% + 2px) !important;
  height: calc(100% + 2px) !important;
  min-width: calc(100% + 2px) !important;
  min-height: calc(100% + 2px) !important;
  max-width: none;
  display: block;
  object-fit: cover !important;
  object-position: center center;
  border: 0;
  border-radius: inherit;
  padding: 0;
  margin: 0;
  transform: scale(1.015);
  transform-origin: center;
  background: #08111d;
  z-index: 2;
}

.publication-square.is-loaded .publication-placeholder {
  opacity: 0;
}

.publication-square.is-error .notification-thumb,
.publication-square.is-error .publication-media {
  display: none;
}

.publication-square.is-error .publication-placeholder {
  opacity: 1;
}

/* Le badge et le point non lu ne doivent jamais être coupés sur petits téléphones. */
.notification-leading,
.profile-trigger,
.suggestion-profile-trigger {
  overflow: visible;
}

@media (max-width: 380px) {
  :root {
    --name-badge-size: 15px;
  }
}

@media (max-width: 330px) {
  :root {
    --name-badge-size: 14px;
  }
}
/* ===== END Fyblic BADGES + MEDIA FIT V4 ===== */

        data.publicationType || data.publication_type || data.postType || data.post_type || 'post',
        data.publicationAction || data.publication_action || data.action || 'view'
      );
    }
  });

  renderNotifications();
  renderSuggestions();
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'HAPPYAD_NOTIFICATION_CENTER_READY', source: 'notification-center-v700-infinite-scroll' }, '*');
    }
  } catch {}
})();

</script>
